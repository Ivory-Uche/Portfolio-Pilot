# Paths, random seeds, and settings for every step. Paths are relative to the project root.

seed: 7275

paths:
  scf_file: data/raw/SCFP2025.csv
  etf_prices_file: data/raw/PortfolioPilot_ETF_Prices.csv
  etf_meta_file: data/raw/etf_download_meta.json
  processed_dir: data/processed
  figures_dir: reports/figures
  tables_dir: reports/tables
  numbers_file: reports/numbers.json
  results_dir: results            # M4 result files (small CSVs, committed)

scf:
  # Where data_access.ensure_scf downloads the summary extract (CSV inside a zip) if data/raw/SCFP2025.csv is missing
  url: https://www.federalreserve.gov/econres/files/scfp2025excel.zip
  # SCF column names in the summary extract (check against the SCF codebook)
  columns:
    household_id: YY1
    record_id: Y1
    weight: WGT
    age: AGE
    income: INCOME
    networth: NETWORTH
    liq: LIQ
    debt: DEBT
    equity: EQUITY
    fin: FIN
    yes_risk: YESFINRISK
    no_risk: NOFINRISK
  implicate: 1
  split: {train: 0.70, val: 0.15, test: 0.15}
  min_stratum_size: 10          # smaller age-band x risk strata are merged into "other"
  cap_quantile: 0.99            # caps for ratio features, fitted on training data

clustering:
  method: kmeans                # "kmeans" or "gmm"
  k_range: [2, 3, 4, 5, 6]
  chosen_k: 5                   # fixed at M4 (M3 automatic rule chose 5); null = choose automatically
  min_cluster_share: 0.05
  silhouette_tolerance: 0.01    # silhouette differences smaller than this count as a tie
  n_bootstrap: 20               # use 3 for a quick test, 20 for final results

pca_threshold: 0.80

etf:
  tickers: [SPY, VEA, VWO, AGG, TLT, TIP, VNQ, GLD, DBC]
  start: "2016-01-01"
  end: "2026-01-01"             # end is exclusive: data through 2025-12-31
  train_end: "2021-12-31"
  val_end: "2023-12-31"

# ---------------------------------------------------------------- M4: baseline models
evaluation:
  use_test: false               # the test set is never loaded at M4; switch on only for the final evaluation
  cv_folds: 5
  cv_seeds: [7275, 11, 23]      # first seed is the main run; the others check that conclusions do not change
  validate_implicates: [2, 3, 4, 5]
  # Success criterion - agreed BEFORE seeing any results. Do not change after running.
  success:
    min_macro_f1: 0.70          # survey-weighted macro F1 on validation
    max_severe_over_risk: 0.05  # share placed 2+ archetypes too aggressive

models:
  questionnaire:                # domain rule: score = risk_willingness + age points, mapped to archetypes
    age_points: {"<35": 2, "35-44": 1, "45-54": 1, "55-64": 0, "65-74": 0, "75+": 0}
  logreg:
    C: 1.0
    max_iter: 2000
    class_weight: balanced
  knn:
    k_grid: [5, 15, 25]         # chosen on the validation set by macro F1
    weights: uniform
