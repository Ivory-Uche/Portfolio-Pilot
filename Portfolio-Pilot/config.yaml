# PortfolioPilot settings. Every path, seed and model setting lives here.
# Paths are relative to the repository root.

seed: 7275

paths:
  scf_file: data/raw/SCFP2025.csv
  etf_file: data/raw/PortfolioPilot_ETF_Prices.csv
  outputs: outputs          # M3 figures, tables, processed data (not committed)
  results: results          # M4 result files (small CSVs are committed)

scf:
  implicate: 1              # models are trained on implicate 1
  cap_quantile: 0.99        # ratio caps learned on training data
  columns:
    household_id: YY1
    record_id: Y1
    weight: WGT
    age: AGE
    income: INCOME
    networth: NETWORTH
    liq: LIQ
    debt: DEBT
    equity: EQUITY
    fin: FIN
    yes_risk: YESFINRISK
    no_risk: NOFINRISK

split:
  train: 0.70
  val: 0.15
  test: 0.15

target:                     # archetype definition (fixed at M4)
  method: kmeans
  k: 5                      # final choice, from the M3 k-selection table
  k_range: [2, 3, 4, 5, 6]
  min_cluster_share: 0.05
  sil_tolerance: 0.01
  n_bootstrap: 20
  sil_sample: 3000

pca:
  threshold: 0.80

etf:
  tickers: [SPY, VEA, VWO, AGG, TLT, TIP, VNQ, GLD, DBC]
  start: "2016-01-01"
  end: "2026-01-01"         # exclusive
  train_end: "2021-12-31"
  val_end: "2023-12-31"
  extreme_sd: 5
  roll_window: 252

evaluation:
  use_test: false           # M4: the test set is never loaded. Switch on only for the final evaluation.
  cv_folds: 5
  cv_seeds: [7275, 11, 23]  # first seed is the main run; the others check that conclusions do not change
  validate_implicates: [2, 3, 4, 5]
  # Success criterion - agreed BEFORE seeing any results. Do not change after running.
  success:
    min_macro_f1: 0.70            # survey-weighted macro F1 on validation
    max_severe_over_risk: 0.05    # share placed 2+ archetypes too aggressive

models:
  questionnaire:            # domain rule: score = risk_willingness + age points, mapped to archetypes
    age_points: {"<35": 2, "35-44": 1, "45-54": 1, "55-64": 0, "65-74": 0, "75+": 0}
  logreg:
    C: 1.0
    max_iter: 2000
    class_weight: balanced
  knn:
    k_grid: [5, 15, 25]     # chosen on the validation set by macro F1
    weights: uniform
